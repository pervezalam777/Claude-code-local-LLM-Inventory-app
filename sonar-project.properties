# Root project key
sonar.projectKey=inventory-management-system
sonar.projectName=Inventory Management System

# Multi-module project setup
sonar.modules=backend,frontend

# Backend module
sonar.backend.projectBaseDir=./inventory_app
sonar.backend.sonar.projectBaseDir=./inventory_app
sonar.backend.sonar.sources=app
sonar.backend.sonar.tests=tests
sonar.backend.sonar.python.coverage.reportPaths=coverage.xml

# Frontend module
sonar.frontend.projectBaseDir=./inventory_ui_app
sonar.frontend.sonar.projectBaseDir=./inventory_ui_app
sonar.frontend.sonar.sources=src
sonar.frontend.sonar.tests=src
sonar.frontend.sonar.javascript.coverage.reportPaths=.sonarqube/coverage-js/report.json

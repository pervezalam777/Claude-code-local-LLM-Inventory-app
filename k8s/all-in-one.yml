# Kubernetes manifest bundle for Inventory App
# Apply with: kubectl apply -f k8s/all-in-one.yml

---
apiVersion: v1
kind: Namespace
metadata:
  name: inventory-app-ns
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: inventory-app-ns
type: Opaque
data:
  username: aW52ZW50b3J5X3VzZXI=
  password: aW52ZW50b3J5X3Bhc3M=
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-pvc
  namespace: inventory-app-ns
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: inventory-app-ns
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: inventory-app-ns
data:
  DATABASE_URL: "postgresql://inventory_user:inventory_pass@postgres:5432/inventory_db"
  PROJECT_NAME: "Inventory Management API"
  ENVIRONMENT: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-ui-config
  namespace: inventory-app-ns
data:
  VITE_API_URL: "/api/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: inventory-app-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: inventory_db
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inventory-app-ns
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: inventory-app-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          image: inventory-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inventory-config
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/items/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: inventory-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app-service
  namespace: inventory-app-ns
spec:
  selector:
    app: inventory-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-ui
  namespace: inventory-app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-ui
  template:
    metadata:
      labels:
        app: inventory-ui
    spec:
      containers:
        - name: inventory-ui
          image: inventory-ui:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: inventory-ui-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-ui-service
  namespace: inventory-app-ns
spec:
  selector:
    app: inventory-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ingress
  namespace: inventory-app-ns
spec:
  rules:
    - host: inventory.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: inventory-app-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-ui-service
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-ui
  namespace: default
  labels:
    app: inventory-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-ui
  template:
    metadata:
      labels:
        app: inventory-ui
    spec:
      containers:
        - name: inventory-ui
          image: inventory-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: inventory-ui-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-ui-service
  namespace: default
spec:
  selector:
    app: inventory-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: default
data:
  DATABASE_URL: "postgresql://inventory_user:inventory_pass@postgres:5432/inventory_db"
  PROJECT_NAME: "Inventory Management API"
  ENVIRONMENT: "production"
  # CORS configuration for Kubernetes deployment
  CORS_ALLOWED_ORIGINS: "http://localhost,http://inventory-ui,http://inventory-ui-service"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-ui-config
  namespace: default
data:
  VITE_API_URL: "/api/"

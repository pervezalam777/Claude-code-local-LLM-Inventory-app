apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: inventory.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: inventory-app-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-ui-service
                port:
                  number: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx-controller
  namespace: default

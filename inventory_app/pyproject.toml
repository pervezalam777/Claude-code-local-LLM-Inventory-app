[tool.poetry]
name = "inventory-app"
version = "0.1.0"
description = "Inventory Management API with FastAPI and SQLite"
authors = ["User <user@example.com>"]
python = "^3.11"

[tool.poetry.dependencies]
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = "^2.0.30"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
alembic = "^1.13.0"
aiosqlite = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

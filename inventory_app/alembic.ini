# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename
# If specified, requires the python >= 3.9 or backports.zoneinfo library.
# Using the local machine's timezone when not specified is deprecated and
# will be disabled in a future release.
# When specified, must be a valid IANA timezone name or UTC offset.
# timezone =

# sqlalchemy database url to target
sqlalchemy.url = ${DATABASE_URL|default}

# SQLAlchemy engine configuration. The following options are available:
# - max_overflow: maximum number of connections that can be opened at once.
# - pool_size: the minimum number of connections maintained by the pool.
# - pool_timeout: seconds to wait before getting a connection from the pool.
# - pool_recycle: number of seconds after which a connection is automatically recycled.
# These parameters are optional and have default values compatible with most applications.
# engine_config = {}

# The version table name that Alembic will use to store schema versioning info
# version_table = alembic_version

# Default transaction isolation level for the connection, e.g. REPEATABLE READ
# isolation_level = REPEATABLE READ

# If true, Alembic will not attempt to echo SQL statements to stdout.
# echo = false

# If true, Alembic will include comments in generated migration scripts.
# include_comments = false

# If true, Alembic will not attempt to sort columns alphabetically in autogenerate output.
# sort_columns = false

# If true, Alembic will infer foreign key constraints from the database instead of SQLAlchemy ForeignKey objects.
# compare_type = true
# compare_server_default = true

# If true, Alembic will include type changes in autogenerate output.
# include_type_changes = false

# If true, Alembic will include server default values in autogenerate output.
# include_schemas = false

# If true, Alembic will raise an error if the migration script contains more than one operation that modifies a table.
# batch_mode = false

# Template for revision identifiers, used by generate.
# rev_id = %(year)d%(month)02d%(day)02d_%(hour)02d%(minute)02d%(second)02d_%(rev)

# Version path separator
# version_path_separator = .

# Revision id source: uuid or int
# rev_id_source = uuid

# If true, use short hostname as part of revision id.
# include_hostname = false

[post_write_hooks]
# post_write_hooks script templates to run after migration generation

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Project identification
sonar.projectKey=inventory-management-python
sonar.projectName=Inventory Management - Python Backend

# Source code location
sonar.sources=app
sonar.tests=tests
sonar.language=py

# Coverage report path (relative to project base)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/migrations/**,app/__init__.py
sonar.test.inclusions=tests/**/*.py

# Encoding
sonar.sourceEncoding=UTF-8

# Project identification
sonar.projectKey=inventory-management-js
sonar.projectName=Inventory Management - Frontend

# Source code location
sonar.sources=src
sonar.tests=src
sonar.language=typescript

# Coverage report path (relative to project base)
sonar.javascript.coverage.reportPaths=.sonarqube/coverage-js/report.json

# File extensions
sonar.sourceFileEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=src/**/*.test.tsx,src/**/*.test.ts,**/node_modules/**,.sonarqube/**
sonar.test.inclusions=src/**/*.test.tsx,src/**/*.test.ts

# Test framework
sonar.javascript.lcov.reportPaths=.sonarqube/coverage-js/lcov.info
